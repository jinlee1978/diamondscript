name: Deploy Privacy Policy
on:
  push:
    branches: [main]
    paths:
      - 'privacy-policy.html'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Validate source file exists
        run: test -f privacy-policy.html
      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Deploy to gh-pages
        run: |
          set -euo pipefail
          cp privacy-policy.html /tmp/privacy-policy.html
          git checkout -B gh-pages
          git rm -rf .
          git clean -fd
          mkdir -p privacy
          cp /tmp/privacy-policy.html privacy/index.html
          git add -A
          git commit -m "Deploy privacy policy [skip ci]"
          git push origin gh-pages --force