<svg width="1284" height="2778" viewBox="0 0 1284 2778" xmlns="http://www.w3.org/2000/svg">
  <!-- Background (iPhone 14 Pro Max dimensions) -->
  <rect width="1284" height="2778" fill="#1B4332"/>

  <!-- Diamond icon (centered) -->
  <g transform="translate(642, 1389) rotate(45)">
    <rect x="-140" y="-140" width="280" height="280" fill="#D4AF37" rx="28"/>
    <rect x="-120" y="-120" width="240" height="240" fill="#1B4332" rx="24"/>
    <rect x="-90" y="-90" width="180" height="180" fill="#D4AF37" rx="18"/>
  </g>

  <!-- App name below diamond -->
  <text x="642" y="1600" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="700" fill="#D4AF37" text-anchor="middle">DiamondScript</text>
  <text x="642" y="1660" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#95A58D" text-anchor="middle">Practice generation for every diamond</text>

  <!-- Subtle shine effect -->
  <defs>
    <linearGradient id="splashShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.05" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
  </defs>
  <rect width="1284" height="2778" fill="url(#splashShine)"/>
</svg>
